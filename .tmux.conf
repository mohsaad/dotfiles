unbind C-b
set -g prefix C-a
set -sg escape-time 0

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# turn mouse scrolling on
setw -g mouse on

# ── Copy mode + iTerm2 (macOS) scroll/clipboard ──────────────────────────
# vi-style keys in copy mode
setw -g mode-keys vi

# FIX: finishing a mouse selection copies WITHOUT cancelling copy mode, so
# the view no longer jumps back to the bottom of the scrollback after a copy.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind   -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
# y in copy mode behaves the same
bind   -T copy-mode-vi y                 send-keys -X copy-selection-no-clear
# a single click clears an existing selection
bind   -T copy-mode-vi MouseDown1Pane    select-pane \; send-keys -X clear-selection

# Push copies to the macOS clipboard through iTerm2 via OSC 52.
# NOTE: enable iTerm2 → Settings → General → Selection →
#       "Applications in terminal may access clipboard"
set -g set-clipboard on
set -ga terminal-overrides ',xterm-256color:Ms=\E]52;c;%p2%s\7'

# Set focus events for vim
set -g focus-events on

# ── Quality-of-life settings ─────────────────────────────────────────────
# bigger scrollback for copying
set -g history-limit 50000
# start window/pane numbering at 1 to match the keyboard layout
set -g base-index 1
setw -g pane-base-index 1
# keep window numbers gapless after closing one
set -g renumber-windows on

# vim-style pane navigation (-r = repeatable without re-pressing the prefix)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
# arrow-key pane navigation (with prefix: C-a then arrows, repeatable)
bind -r Left  select-pane -L
bind -r Down  select-pane -D
bind -r Up    select-pane -U
bind -r Right select-pane -R
# pane resizing (with prefix: C-a then capital H/J/K/L, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# pane navigation (NO prefix: just Ctrl+arrow to move between panes)
bind -n C-Left  select-pane -L
bind -n C-Down  select-pane -D
bind -n C-Up    select-pane -U
bind -n C-Right select-pane -R

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# Set background/foreground color to orange/dark-blue
set -g status-bg colour208
set -g status-fg colour17

# terminal type + truecolor (better than screen-256color for iTerm2)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',xterm-256color:Tc'
setw -q -g utf-8 on

# ── Plugins (tmux-resurrect, tmux-yank) ──────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: auto-save the session every 15 min and restore on start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize tmux plugin manager — KEEP THIS AS THE LAST LINE
run -b '~/.tmux/plugins/tpm/tpm'
